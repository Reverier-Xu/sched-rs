[package]
name        = "sched-cli"
version     = "0.1.0"
edition     = "2024"
license     = "MIT OR Apache-2.0"
description = "A cron-style daemon built on the sched library"
publish     = false

[[bin]]
name = "sched"
path = "src/main.rs"

[dependencies]
sched              = { path = "../.." }
smol               = "2"
async-process      = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
